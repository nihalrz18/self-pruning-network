[project]
name = "aqua-self-pruning"
version = "0.1.0"
description = "From-scratch NumPy autodiff + self-pruning MLP (AQUA hiring challenge)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["engine", "nn", "prune", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
